<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>selfnas Relay 管理台</title><link rel="stylesheet" href="/style.css"></head><body><main id="app"><section class="card login" id="login"><h1>selfnas Relay</h1><p>中转服务管理控制台</p><form id="loginForm"><input id="username" placeholder="管理员账号" autocomplete="username" required><input id="password" type="password" placeholder="管理员密码" autocomplete="current-password" required><button>登录</button><div class="error" id="loginError"></div></form></section><section id="console" hidden><header><div><b>selfnas Relay</b><span class="muted">管理控制台</span></div><button class="ghost" id="logout">退出</button></header><div class="grid"><section class="card"><h2>服务概览</h2><div class="stats"><div><b id="pendingCount">0</b><span>待审批</span></div><div><b id="nodeCount">0</b><span>节点</span></div><div><b id="onlineCount">0</b><span>在线</span></div></div></section><section class="card"><h2>中转限制</h2><form id="limitForm"><label>默认节点带宽（MB/s）<input id="bandwidth" type="number" min="0.1" step="0.1"></label><label>单节点最大连接数<input id="connections" type="number" min="1" step="1"></label><button>保存限制</button><span class="saved" id="limitSaved"></span></form></section></div><section class="card"><div class="sectionHead"><h2>接入申请</h2><button class="ghost" id="refresh">刷新</button></div><div class="tableWrap"><table><thead><tr><th>设备</th><th>平台</th><th>版本</th><th>申请时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="applications"></tbody></table></div></section><section class="card"><div class="sectionHead"><h2>已接入节点</h2><button class="ghost" id="refreshNodes">刷新</button></div><div class="tableWrap"><table><thead><tr><th>设备</th><th>节点 ID</th><th>状态</th><th>带宽</th><th>连接数</th><th>操作</th></tr></thead><tbody id="nodes"></tbody></table></div></section></section></main><script src="/app.js"></script></body></html>
